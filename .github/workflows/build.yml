
name: build

on:
  push:
    branches: ["main", "master", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     pkg: linux-x86_64-gcc,   drivers: 'ON',  tests: true, coro: 'OFF',
              cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04,     pkg: linux-x86_64-clang, drivers: 'ON',  tests: true, coro: 'OFF',
              cc: clang, cxx: clang++ }

          - { os: ubuntu-24.04-arm, pkg: linux-aarch64-gcc,  drivers: 'ON',  tests: true, coro: 'OFF',
              cc: gcc,   cxx: g++ }

          - { os: macos-14,         pkg: macos-arm64-clang,  drivers: 'ON',  tests: true, coro: 'OFF',
              cc: clang, cxx: clang++ }

          - { os: windows-latest,   pkg: windows-x86_64-msvc, drivers: 'OFF', tests: true, coro: 'OFF' }

          - { os: ubuntu-24.04,     pkg: linux-x86_64-gcc-coro,   drivers: 'OFF', tests: true, coro: 'ON',
              cc: gcc,   cxx: g++ }
          - { os: windows-latest,   pkg: windows-x86_64-msvc-coro, drivers: 'OFF', tests: true, coro: 'ON' }

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sudo apt-get install -y default-libmysqlclient-dev libpqxx-dev libpq-dev unixodbc-dev

      - name: 安装依赖 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja mysql-client libpqxx libpq unixodbc

      - name: 组装 CMAKE_PREFIX_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          p="$(brew --prefix)"
          for formula in mysql-client libpq libpqxx unixodbc; do
            if d="$(brew --prefix "$formula" 2>/dev/null)"; then p="$p:$d"; fi
          done
          echo "CMAKE_PREFIX_PATH=$p" >> "$GITHUB_ENV"

      - name: 配置 (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDBMW_ENABLE_MYSQL=${{ matrix.drivers }} \
            -DDBMW_ENABLE_POSTGRES=${{ matrix.drivers }} \
            -DDBMW_ENABLE_ODBC=${{ matrix.drivers }} \
            -DDBMW_ENABLE_ASYNC_CORO=${{ matrix.coro }} \
            -DDBMW_BUILD_TESTS=ON

      - name: 配置 (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64 `
            -DDBMW_ENABLE_MYSQL=${{ matrix.drivers }} `
            -DDBMW_ENABLE_POSTGRES=${{ matrix.drivers }} `
            -DDBMW_ENABLE_ODBC=${{ matrix.drivers }} `
            -DDBMW_ENABLE_ASYNC_CORO=${{ matrix.coro }} `
            -DDBMW_BUILD_TESTS=ON

      - name: 编译
        run: cmake --build build --config Release -j

      - name: 测试
        if: matrix.tests
        shell: bash
        run: |
          if [ "${{ matrix.coro }}" = "ON" ]; then
            ctest --test-dir build -C Release -R dbmw_coro_test --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: 安装到 dist
        if: github.ref != 'refs/heads/dev'
        run: cmake --install build --config Release --prefix dist

      - name: 打包
        if: github.ref != 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then ver="dev-${GITHUB_SHA::7}"; fi
          if [ "${{ runner.os }}" = "Windows" ]; then ext=zip; else ext=tar.gz; fi
          pkg="dbmw-${ver}-${{ matrix.pkg }}.${ext}"
          cp LICENSE README.md dist/
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath '${pkg}'"
          else
            tar -czf "${pkg}" -C dist .
          fi
          ls -l "${pkg}"
          echo "PKG_FILE=${pkg}" >> "$GITHUB_ENV"

      - name: 上传 artifact
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: dbmw-${{ matrix.pkg }}
          path: ${{ env.PKG_FILE }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 收集各平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: dbmw-*
          merge-multiple: true
          path: artifacts

      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "dbmw $TAG" \
              --verify-tag \
              --generate-notes \
              artifacts/*
          fi
