
name: build

on:
  push:
    branches: ["dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     pkg: linux-x86_64-gcc,   drivers: 'ON',  tests: true,
              cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04,     pkg: linux-x86_64-clang, drivers: 'ON',  tests: true,
              cc: clang, cxx: clang++ }

          - { os: ubuntu-24.04-arm, pkg: linux-aarch64-gcc,  drivers: 'ON',  tests: true,
              cc: gcc,   cxx: g++ }

          - { os: macos-14,         pkg: macos-arm64-clang,  drivers: 'ON',  tests: true,
              cc: clang, cxx: clang++ }

          - { os: windows-latest,   pkg: windows-x86_64-msvc, drivers: 'OFF', tests: true }

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-jsonschema python3-yaml
          sudo apt-get install -y default-libmysqlclient-dev libpqxx-dev libpq-dev unixodbc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config mysql-client libpqxx libpq unixodbc

      - name: Configure CMAKE_PREFIX_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          p="$(brew --prefix)"
          for formula in mysql-client libpq libpqxx unixodbc; do
            if d="$(brew --prefix "$formula" 2>/dev/null)"; then p="$p:$d"; fi
          done
          echo "CMAKE_PREFIX_PATH=$p" >> "$GITHUB_ENV"

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSQLCONDUIT_ENABLE_MYSQL=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_POSTGRES=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_ODBC=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_ORACLE=OFF \
            -DSQLCONDUIT_BUILD_TESTS=ON \
            -DSQLCONDUIT_BUILD_BENCHMARKS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64 `
            -DSQLCONDUIT_ENABLE_MYSQL=OFF `
            -DSQLCONDUIT_ENABLE_POSTGRES=OFF `
            -DSQLCONDUIT_ENABLE_ODBC=ON `
            -DSQLCONDUIT_ENABLE_ORACLE=OFF `
            -DSQLCONDUIT_BUILD_TESTS=ON `
            -DSQLCONDUIT_BUILD_BENCHMARKS=ON `
            -DSQLCONDUIT_BUILD_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Validate JSON and YAML configuration Schema
        if: matrix.pkg == 'linux-x86_64-gcc'
        run: |
          python3 -m jsonschema \
            --instance config/datasources.json.example \
            config/sqlconduit.schema.json
          python3 -c "import json, yaml; from jsonschema import Draft202012Validator; schema=json.load(open('config/sqlconduit.schema.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(yaml.safe_load(open('config/datasource.yaml.example', encoding='utf-8')))"

      - name: Test
        if: matrix.tests
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure -LE integration

      - name: Run performance baseline
        if: matrix.pkg == 'linux-x86_64-gcc'
        run: >-
          ./build/benchmarks/sqlconduit_benchmark
          --iterations 20000
          --json benchmark-results.json

      - name: Upload performance baseline
        if: matrix.pkg == 'linux-x86_64-gcc'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-results-linux-x86_64-gcc
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Consumer smoke test (installed package)
        if: runner.os != 'Windows' && matrix.drivers == 'ON'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$PWD/smoke-prefix"
          cmake --install build --config Release --prefix "$prefix"

          for component in Core MySQL Postgres ODBC; do
            build_dir="smoke-find-package-${component}"
            echo "== find_package component: ${component} =="
            cmake -S tests/consumer -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" \
              -DSQLCONDUIT_CONSUMER_COMPONENT="$component"
            cmake --build "$build_dir"
            "$build_dir/sqlconduit_consumer_smoke"
          done

          echo "== via pkg-config (static link) =="
          if [ "${{ runner.os }}" != "Linux" ]; then
            echo "skipped on macOS: Homebrew dependencies are outside the default"
            echo "linker search path, so a pkg-config consumer must add -L itself"
          else
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
            pkg-config --exists sqlconduit
            pkg-config --libs --static sqlconduit
            ${CXX:-c++} -std=c++17 tests/consumer/main.cpp \
              $(pkg-config --cflags sqlconduit) \
              $(pkg-config --libs --static sqlconduit) -o smoke-pkgconfig
            ./smoke-pkgconfig
          fi

      - name: Consumer smoke test (installed package, MSVC)
        if: runner.os == 'Windows' && matrix.tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $prefix = Join-Path $PWD 'smoke-prefix'
          cmake --install build --config Release --prefix $prefix
          foreach ($component in @('Core', 'ODBC')) {
            $buildDir = "smoke-find-package-$component"
            cmake -S tests/consumer -B $buildDir -A x64 `
              "-DCMAKE_PREFIX_PATH=$prefix" `
              "-DSQLCONDUIT_CONSUMER_COMPONENT=$component"
            cmake --build $buildDir --config Release
            & ".\$buildDir\Release\sqlconduit_consumer_smoke.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install to dist
        if: github.ref != 'refs/heads/dev'
        run: cmake --install build --config Release --prefix dist

      - name: Package
        if: github.ref != 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then ver="dev-${GITHUB_SHA::7}"; fi
          if [ "${{ runner.os }}" = "Windows" ]; then ext=zip; else ext=tar.gz; fi
          pkg="sqlconduit-${ver}-${{ matrix.pkg }}.${ext}"
          cp LICENSE README.md README_zh.md CHANGELOG.md SUPPORT.md SECURITY.md CONTRIBUTING.md dist/
          cp docs/known_limitations.md dist/KNOWN_LIMITATIONS.md
          cp docs/feature_coverage.md dist/FEATURE_COVERAGE.md
          cp docs/feature_coverage_zh.md dist/FEATURE_COVERAGE_zh.md
          if [ "$ext" = "zip" ]; then
            (cd dist && cmake -E tar cf "../${pkg}" --format=zip -- .)
          else
            tar -czf "${pkg}" -C dist .
          fi
          ls -l "${pkg}"
          echo "PKG_FILE=${pkg}" >> "$GITHUB_ENV"
          echo "PROVENANCE_FILE=${pkg}.provenance.sigstore.json" >> "$GITHUB_ENV"

      - name: Attest platform build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        id: platform-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.PKG_FILE }}

      - name: Preserve platform provenance bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.platform-provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$PROVENANCE_FILE"

      - name: Upload artifact
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sqlconduit-${{ matrix.pkg }}
          path: |
            ${{ env.PKG_FILE }}
            ${{ env.PROVENANCE_FILE }}
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: warnings + ASan/UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure strict sanitizer build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DSQLCONDUIT_BUILD_TESTS=ON
      - run: cmake --build build-sanitize -j
      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          LSAN_OPTIONS: exitcode=23:report_objects=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  concurrency-sanitizer:
    name: targeted ThreadSanitizer
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure ThreadSanitizer build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DSQLCONDUIT_BUILD_TESTS=ON
      - run: >-
          cmake --build build-tsan -j
          --target sqlconduit_query_cache_test sqlconduit_concurrency_test
      - name: Run cache and lifecycle contention tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure -L concurrency

  coverage:
    name: core coverage report
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcovr ninja-build
      - name: Configure coverage build
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DSQLCONDUIT_BUILD_TESTS=ON
      - run: cmake --build build-coverage -j
      - run: ctest --test-dir build-coverage --output-on-failure
      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/' --filter 'include/' \
            --exclude 'tests/' \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --xml coverage/coverage.xml --xml-pretty \
            --html-details coverage/index.html
          {
            echo '### Core test coverage'
            echo '```text'
            gcovr --root . --filter 'src/' --filter 'include/' \
              --exclude 'tests/' \
              --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
              --txt-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: core-coverage-report
          path: coverage
          if-no-files-found: error
          retention-days: 30

  integration-open-source:
    name: live MySQL + PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlconduit-ci-mysql
          MYSQL_DATABASE: sqlconduit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psqlconduit-ci-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sqlconduit-ci-postgres
          POSTGRES_DB: sqlconduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sqlconduit_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SQLCONDUIT_TEST_MYSQL_HOST: 127.0.0.1
      SQLCONDUIT_TEST_MYSQL_USER: root
      SQLCONDUIT_TEST_MYSQL_PASSWORD: sqlconduit-ci-mysql
      SQLCONDUIT_TEST_MYSQL_DATABASE: sqlconduit_test
      SQLCONDUIT_TEST_PG_HOST: 127.0.0.1
      SQLCONDUIT_TEST_PG_USER: postgres
      SQLCONDUIT_TEST_PG_PASSWORD: sqlconduit-ci-postgres
      SQLCONDUIT_TEST_PG_DATABASE: sqlconduit_test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config default-libmysqlclient-dev libpqxx-dev libpq-dev
      - run: >-
          cmake -S . -B build-integration -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSQLCONDUIT_ENABLE_MYSQL=ON
          -DSQLCONDUIT_ENABLE_POSTGRES=ON
          -DSQLCONDUIT_BUILD_TESTS=ON
          -DSQLCONDUIT_BUILD_INTEGRATION_TESTS=ON
      - run: cmake --build build-integration -j
      - run: ctest --test-dir build-integration --output-on-failure -R 'mysql_integration|postgres_integration'

  integration-sqlserver:
    name: live SQL Server / ODBC integration
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SqlConduit-CI-2026!
        ports:
          - 1433:1433
    env:
      SQLCONDUIT_TEST_ODBC_HOST: 127.0.0.1
      SQLCONDUIT_TEST_ODBC_USER: sa
      SQLCONDUIT_TEST_ODBC_PASSWORD: SqlConduit-CI-2026!
      SQLCONDUIT_TEST_ODBC_DATABASE: master
      SQLCONDUIT_TEST_ODBC_DRIVER: FreeTDS
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config unixodbc-dev tdsodbc netcat-openbsd curl
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
            -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Wait for SQL Server
        run: |
          for attempt in {1..60}; do
            if nc -z 127.0.0.1 1433; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: >-
          cmake -S . -B build-integration -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSQLCONDUIT_ENABLE_ODBC=ON
          -DSQLCONDUIT_BUILD_TESTS=ON
          -DSQLCONDUIT_BUILD_INTEGRATION_TESTS=ON
      - run: cmake --build build-integration -j
      - name: Test through FreeTDS fallback
        run: ctest --test-dir build-integration --output-on-failure -R odbc_integration
      - name: Test Microsoft ODBC Driver 18 native async
        env:
          SQLCONDUIT_TEST_ODBC_DRIVER: ODBC Driver 18 for SQL Server
        run: ctest --test-dir build-integration --output-on-failure -R odbc_integration

  release:
    name: publish release
    needs: [build, sanitizers, concurrency-sanitizer, coverage, integration-open-source, integration-sqlserver]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            $0 == heading { found=1 }
            found && /^## \[/ && $0 != heading { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Download platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: sqlconduit-*
          merge-multiple: true
          path: artifacts

      - name: Extract packages for SBOM analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom-root
          for package in artifacts/*.tar.gz; do
            [ -e "$package" ] || continue
            name="$(basename "$package" .tar.gz)"
            mkdir -p "sbom-root/$name"
            tar -xzf "$package" -C "sbom-root/$name"
          done
          for package in artifacts/*.zip; do
            [ -e "$package" ] || continue
            name="$(basename "$package" .zip)"
            mkdir -p "sbom-root/$name"
            python3 - "$package" "sbom-root/$name" <<'PY'
          import pathlib
          import shutil
          import sys
          import zipfile

          archive_path = pathlib.Path(sys.argv[1])
          output_root = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive_path) as archive:
              for entry in archive.infolist():
                  normalized = entry.filename.replace("\\", "/")
                  relative = pathlib.PurePosixPath(normalized)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise RuntimeError(f"unsafe ZIP entry: {entry.filename}")
                  target = output_root.joinpath(*relative.parts)
                  if entry.is_dir() or normalized.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as source, target.open("wb") as destination:
                      shutil.copyfileobj(source, destination)
          PY
          done
          test -n "$(find sbom-root -type f -print -quit)"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: sbom-root
          format: spdx-json
          output-file: artifacts/sqlconduit-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          sbom-path: artifacts/sqlconduit-${{ github.ref_name }}.spdx.json

      - name: Preserve SBOM attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.sbom-attestation.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE_PATH" "artifacts/sqlconduit-${TAG}.sbom.sigstore.json"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS \
            -printf '%f\n' | sort)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l artifacts
          prerelease_args=()
          if [[ "$TAG" == *-* ]]; then prerelease_args+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SQLConduit $TAG" \
              "${prerelease_args[@]}" \
              --notes-file release-notes.md
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SQLConduit $TAG" \
              --verify-tag \
              "${prerelease_args[@]}" \
              --notes-file release-notes.md \
              artifacts/*
          fi
