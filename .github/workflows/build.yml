
name: build

on:
  push:
    branches: ["main", "master", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     pkg: linux-x86_64-gcc,   drivers: 'ON',  tests: true,
              cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04,     pkg: linux-x86_64-clang, drivers: 'ON',  tests: true,
              cc: clang, cxx: clang++ }

          - { os: ubuntu-24.04-arm, pkg: linux-aarch64-gcc,  drivers: 'ON',  tests: true,
              cc: gcc,   cxx: g++ }

          - { os: macos-14,         pkg: macos-arm64-clang,  drivers: 'ON',  tests: true,
              cc: clang, cxx: clang++ }

          - { os: windows-latest,   pkg: windows-x86_64-msvc, drivers: 'OFF', tests: true }

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-jsonschema python3-yaml
          sudo apt-get install -y default-libmysqlclient-dev libpqxx-dev libpq-dev unixodbc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config mysql-client libpqxx libpq unixodbc

      - name: Configure CMAKE_PREFIX_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          p="$(brew --prefix)"
          for formula in mysql-client libpq libpqxx unixodbc; do
            if d="$(brew --prefix "$formula" 2>/dev/null)"; then p="$p:$d"; fi
          done
          echo "CMAKE_PREFIX_PATH=$p" >> "$GITHUB_ENV"

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSQLCONDUIT_ENABLE_MYSQL=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_POSTGRES=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_ODBC=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_ORACLE=OFF \
            -DSQLCONDUIT_BUILD_TESTS=ON \
            -DSQLCONDUIT_BUILD_BENCHMARKS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64 `
            -DSQLCONDUIT_ENABLE_MYSQL=OFF `
            -DSQLCONDUIT_ENABLE_POSTGRES=OFF `
            -DSQLCONDUIT_ENABLE_ODBC=ON `
            -DSQLCONDUIT_ENABLE_ORACLE=OFF `
            -DSQLCONDUIT_BUILD_TESTS=ON `
            -DSQLCONDUIT_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Validate JSON and YAML configuration Schema
        if: matrix.pkg == 'linux-x86_64-gcc'
        run: |
          python3 -m jsonschema \
            --instance config/datasources.json.example \
            config/sqlconduit.schema.json
          python3 -c "import json, yaml; from jsonschema import Draft202012Validator; schema=json.load(open('config/sqlconduit.schema.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(yaml.safe_load(open('config/datasource.yaml.example', encoding='utf-8')))"

      - name: Test
        if: matrix.tests
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Run performance baseline
        if: matrix.pkg == 'linux-x86_64-gcc'
        run: >-
          ./build/benchmarks/sqlconduit_benchmark
          --iterations 20000
          --json benchmark-results.json

      - name: Upload performance baseline
        if: matrix.pkg == 'linux-x86_64-gcc'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-results-linux-x86_64-gcc
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Consumer smoke test (installed package)
        if: runner.os != 'Windows' && matrix.drivers == 'ON'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$PWD/smoke-prefix"
          cmake --install build --config Release --prefix "$prefix"

          echo "== via find_package =="
          cmake -S tests/consumer -B smoke-find-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" \
            -DSQLCONDUIT_CONSUMER_COMPONENT=MySQL
          cmake --build smoke-find-package
          ./smoke-find-package/sqlconduit_consumer_smoke

          echo "== via pkg-config (static link) =="
          if [ "${{ runner.os }}" != "Linux" ]; then
            echo "skipped on macOS: Homebrew dependencies are outside the default"
            echo "linker search path, so a pkg-config consumer must add -L itself"
          else
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
            pkg-config --exists sqlconduit
            pkg-config --libs --static sqlconduit
            ${CXX:-c++} -std=c++17 tests/consumer/main.cpp \
              $(pkg-config --cflags sqlconduit) \
              $(pkg-config --libs --static sqlconduit) -o smoke-pkgconfig
            ./smoke-pkgconfig
          fi

      - name: Consumer smoke test (installed package, MSVC)
        if: runner.os == 'Windows' && matrix.tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $prefix = Join-Path $PWD 'smoke-prefix'
          cmake --install build --config Release --prefix $prefix
          cmake -S tests/consumer -B smoke-find-package -A x64 `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            -DSQLCONDUIT_CONSUMER_COMPONENT=ODBC
          cmake --build smoke-find-package --config Release
          & .\smoke-find-package\Release\sqlconduit_consumer_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install to dist
        if: github.ref != 'refs/heads/dev'
        run: cmake --install build --config Release --prefix dist

      - name: Package
        if: github.ref != 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then ver="dev-${GITHUB_SHA::7}"; fi
          if [ "${{ runner.os }}" = "Windows" ]; then ext=zip; else ext=tar.gz; fi
          pkg="sqlconduit-${ver}-${{ matrix.pkg }}.${ext}"
          cp LICENSE README.md CHANGELOG.md dist/
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath '${pkg}'"
          else
            tar -czf "${pkg}" -C dist .
          fi
          ls -l "${pkg}"
          echo "PKG_FILE=${pkg}" >> "$GITHUB_ENV"
          echo "PROVENANCE_FILE=${pkg}.provenance.sigstore.json" >> "$GITHUB_ENV"

      - name: Attest platform build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        id: platform-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.PKG_FILE }}

      - name: Preserve platform provenance bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.platform-provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$PROVENANCE_FILE"

      - name: Upload artifact
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sqlconduit-${{ matrix.pkg }}
          path: |
            ${{ env.PKG_FILE }}
            ${{ env.PROVENANCE_FILE }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            $0 == heading { found=1 }
            found && /^## \[/ && $0 != heading { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Download platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: sqlconduit-*
          merge-multiple: true
          path: artifacts

      - name: Extract packages for SBOM analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom-root
          for package in artifacts/*.tar.gz; do
            [ -e "$package" ] || continue
            name="$(basename "$package" .tar.gz)"
            mkdir -p "sbom-root/$name"
            tar -xzf "$package" -C "sbom-root/$name"
          done
          for package in artifacts/*.zip; do
            [ -e "$package" ] || continue
            name="$(basename "$package" .zip)"
            mkdir -p "sbom-root/$name"
            unzip -q "$package" -d "sbom-root/$name"
          done
          test -n "$(find sbom-root -type f -print -quit)"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: sbom-root
          format: spdx-json
          output-file: artifacts/sqlconduit-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          sbom-path: artifacts/sqlconduit-${{ github.ref_name }}.spdx.json

      - name: Preserve SBOM attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.sbom-attestation.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE_PATH" "artifacts/sqlconduit-${TAG}.sbom.sigstore.json"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS \
            -printf '%f\n' | sort)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SQLConduit $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SQLConduit $TAG" \
              --verify-tag \
              --notes-file release-notes.md \
              artifacts/*
          fi
