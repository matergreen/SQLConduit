
name: build

on:
  push:
    branches: ["main", "master", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     pkg: linux-x86_64-gcc,   drivers: 'ON',  tests: true,
              cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04,     pkg: linux-x86_64-clang, drivers: 'ON',  tests: true,
              cc: clang, cxx: clang++ }

          - { os: ubuntu-24.04-arm, pkg: linux-aarch64-gcc,  drivers: 'ON',  tests: true,
              cc: gcc,   cxx: g++ }

          - { os: macos-14,         pkg: macos-arm64-clang,  drivers: 'ON',  tests: true,
              cc: clang, cxx: clang++ }

          - { os: windows-latest,   pkg: windows-x86_64-msvc, drivers: 'OFF', tests: true }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          sudo apt-get install -y default-libmysqlclient-dev libpqxx-dev libpq-dev unixodbc-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config mysql-client libpqxx libpq unixodbc

      - name: Configure CMAKE_PREFIX_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          p="$(brew --prefix)"
          for formula in mysql-client libpq libpqxx unixodbc; do
            if d="$(brew --prefix "$formula" 2>/dev/null)"; then p="$p:$d"; fi
          done
          echo "CMAKE_PREFIX_PATH=$p" >> "$GITHUB_ENV"

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSQLCONDUIT_ENABLE_MYSQL=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_POSTGRES=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_ODBC=${{ matrix.drivers }} \
            -DSQLCONDUIT_ENABLE_ORACLE=OFF \
            -DSQLCONDUIT_BUILD_TESTS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64 `
            -DSQLCONDUIT_ENABLE_MYSQL=OFF `
            -DSQLCONDUIT_ENABLE_POSTGRES=OFF `
            -DSQLCONDUIT_ENABLE_ODBC=ON `
            -DSQLCONDUIT_ENABLE_ORACLE=OFF `
            -DSQLCONDUIT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        if: matrix.tests
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Consumer smoke test (installed package)
        if: runner.os != 'Windows' && matrix.drivers == 'ON'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$PWD/smoke-prefix"
          cmake --install build --config Release --prefix "$prefix"

          echo "== via find_package =="
          cmake -S tests/consumer -B smoke-find-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" \
            -DSQLCONDUIT_CONSUMER_COMPONENT=MySQL
          cmake --build smoke-find-package
          ./smoke-find-package/sqlconduit_consumer_smoke

          echo "== via pkg-config (static link) =="
          if [ "${{ runner.os }}" != "Linux" ]; then
            echo "skipped on macOS: Homebrew dependencies are outside the default"
            echo "linker search path, so a pkg-config consumer must add -L itself"
          else
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
            pkg-config --exists sqlconduit
            pkg-config --libs --static sqlconduit
            ${CXX:-c++} -std=c++17 tests/consumer/main.cpp \
              $(pkg-config --cflags sqlconduit) \
              $(pkg-config --libs --static sqlconduit) -o smoke-pkgconfig
            ./smoke-pkgconfig
          fi

      - name: Consumer smoke test (installed package, MSVC)
        if: runner.os == 'Windows' && matrix.tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $prefix = Join-Path $PWD 'smoke-prefix'
          cmake --install build --config Release --prefix $prefix
          cmake -S tests/consumer -B smoke-find-package -A x64 `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            -DSQLCONDUIT_CONSUMER_COMPONENT=ODBC
          cmake --build smoke-find-package --config Release
          & .\smoke-find-package\Release\sqlconduit_consumer_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install to dist
        if: github.ref != 'refs/heads/dev'
        run: cmake --install build --config Release --prefix dist

      - name: Package
        if: github.ref != 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then ver="dev-${GITHUB_SHA::7}"; fi
          if [ "${{ runner.os }}" = "Windows" ]; then ext=zip; else ext=tar.gz; fi
          pkg="sqlconduit-${ver}-${{ matrix.pkg }}.${ext}"
          cp LICENSE README.md CHANGELOG.md dist/
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath '${pkg}'"
          else
            tar -czf "${pkg}" -C dist .
          fi
          ls -l "${pkg}"
          echo "PKG_FILE=${pkg}" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: sqlconduit-${{ matrix.pkg }}
          path: ${{ env.PKG_FILE }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            $0 == heading { found=1 }
            found && /^## \[/ && $0 != heading { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sqlconduit-*
          merge-multiple: true
          path: artifacts

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SQLConduit $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SQLConduit $TAG" \
              --verify-tag \
              --notes-file release-notes.md \
              artifacts/*
          fi
